# The root's tools, its check, and its currency tasks.
# See architecture/principles/rolling-currency.md
[settings]
task.run_auto_install = false

[tools]
"aqua:google/go-containerregistry" = "0.22.1"
"github:standards-lab/claude-plugins" = { version = "0.24.1", version_prefix = "marathon/v" }
jq = "1.8.2"
shellcheck = "0.11.0"
uv = "0.13.10"

[env]
GO_MODULES = ""
PEP723_SCRIPTS = "lib/generate.py"

[tasks.check]
description = "Validate the compose stack when one exists, shellcheck every tracked sh or bash script, run lint-context and lint-references, run the shell tests, then check dataset/dataset.json when it exists; writes nothing"
run = "bash scripts/check.sh"

[tasks.dataset]
description = "Run a dataset command: mise run dataset -- <group> <verb> [args...]; with no arguments, list the commands"
run = "bin/dataset"

[tasks."dataset:live"]
description = "Run tree load, a second tree load, tree reset, and tree load against the Mikoshi at MIKOSHI_URL, asserting each step's counts and the tree it leaves; needs the stack up and Mikoshi running on 5442, and mise run check never runs it"
run = "bash scripts/dataset-live.sh"

[tasks.currency]
description = "Report every mise tool, PEP 723 script package, action pin, image tag, Dockerfile FROM tag, and Dockerfile source ARG behind its latest, a held one with its reason; writes nothing"
run = "bash scripts/currency.sh report"

[tasks.upgrade]
description = "Bump the mise tools, PEP 723 script packages, action pins, image tags, Dockerfile FROM tags, and Dockerfile source ARGs to their latest, but a held one; rewrites mise.toml, the scripts and their locks, the workflows, and the compose files"
run = "bash scripts/currency.sh upgrade"

[tasks."stack:up"]
description = "Build and start the compose stack and wait until every service is healthy; print the stack's logs if it fails"
run = "docker compose up -d --build --wait || { docker compose logs; exit 1; }"

[tasks."stack:down"]
description = "Stop the compose stack, keeping its volumes"
run = "docker compose down"

[tasks."stack:reset"]
description = "Stop the compose stack and drop its volumes"
run = "docker compose down -v"

[tasks."stack:smoke"]
description = "Prove each service of the running compose stack does its job, using only its container's own tools"
run = "bash scripts/smoke.sh"
