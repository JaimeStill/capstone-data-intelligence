# The root's tools, its check, and its currency tasks.
# See architecture/principles/rolling-currency.md
[settings]
task.run_auto_install = false

[tools]
"aqua:google/go-containerregistry" = "0.22.1"
"github:standards-lab/claude-plugins" = { version = "0.24.1", version_prefix = "marathon/v" }
jq = "1.8.2"
shellcheck = "0.11.0"

[env]
GO_MODULES = ""

[tasks.check]
description = "Validate the compose stack when one exists, shellcheck every script, then run lint-context and lint-references; writes nothing"
run = '''
set -eu
cd "$MISE_PROJECT_ROOT"
if [ -f compose.yml ]; then echo "check: compose"; docker compose config -q; fi
scripts=$(git ls-files '*.sh')
if [ -n "$scripts" ]; then echo "check: shellcheck"; shellcheck $scripts; fi
fail=0
for lint in lint-context lint-references; do
  echo "check: $lint"
  "$lint" || fail=1
done
exit "$fail"
'''

[tasks.currency]
description = "Report every mise tool, action pin, image tag, Dockerfile FROM tag, and Dockerfile source ARG behind its latest, a held one with its reason; writes nothing"
run = "bash scripts/currency.sh report"

[tasks.upgrade]
description = "Bump the mise tools, action pins, image tags, Dockerfile FROM tags, and Dockerfile source ARGs to their latest, but a held one; rewrites mise.toml, the workflows, and the compose files"
run = "bash scripts/currency.sh upgrade"

[tasks."stack:up"]
description = "Build and start the compose stack and wait until every service is healthy; print the stack's logs if it fails"
run = "docker compose up -d --build --wait || { docker compose logs; exit 1; }"

[tasks."stack:down"]
description = "Stop the compose stack, keeping its volumes"
run = "docker compose down"

[tasks."stack:reset"]
description = "Stop the compose stack and drop its volumes"
run = "docker compose down -v"

[tasks."stack:smoke"]
description = "Prove each service of the running compose stack does its job, using only its container's own tools"
run = "bash scripts/smoke.sh"
